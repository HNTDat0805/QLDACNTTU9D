name: Frontend CI

on:
  push:
    branches:
      - Dev
      - main
      - master
      - "feat/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches:
      - Dev
      - main
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build React Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint Frontend (Biome)
        run: bun run --filter frontend lint

      - name: Build Frontend Application
        run: bun run --filter frontend build
        env:
          VITE_API_URL: ""

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-artifact
          path: backend/app/frontend
          retention-days: 7
