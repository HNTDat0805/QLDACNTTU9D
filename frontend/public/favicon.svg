  <path d="M35 26 L36.5 27.5 L27.5 36.5 C26.8 37.2 25.8 37.5 24.8 37.3 L23.5 38.6 C23 39.1 22.2 39.1 21.7 38.6 C21.2 38.1 21.2 37.3 21.7 36.8 L23 35.5 C22.8 34.5 23.1 33.5 23.8 32.8 L32.8 23.8 L34.3 25.3 Z" fill="url(#spark-grad)" />
